apiVersion: apps/v1
kind: Deployment

metadata:
  name: gm-hms

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gm-hms

  template:
    metadata:
      labels:
        app: gm-hms

    spec:
      containers:
      - name: gm-hms
        image: gm_hms_dock:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "hmsci"
        - name: DB_USERNAME
          value: "gmuser"
        - name: DB_PASSWORD
          value: "gm123"