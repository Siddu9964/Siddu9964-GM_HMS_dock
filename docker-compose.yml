services:

  web:
    build: .
    container_name: gm_hms_dock_web

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hmsci
      DB_USERNAME: gmuser
      DB_PASSWORD: gm123

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: gm_hms_dock_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hmsci
      MYSQL_USER: gmuser
      MYSQL_PASSWORD: gm123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
